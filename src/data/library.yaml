- id: mit-1806
  title: MIT 18.06 Linear Algebra
  by: Gilbert Strang
  url: https://ocw.mit.edu/courses/18-06-linear-algebra-spring-2010/
  kind: course
  area: science-tech
  level: core
  free: true
  why: The classic linear algebra course, with lectures and problem sets.
- id: seeing-theory
  title: Seeing Theory
  url: https://seeing-theory.brown.edu/
  kind: course
  area: science-tech
  level: start
  free: true
  why: Interactive visual introduction to probability and statistics.
- id: erickson-algorithms
  title: Algorithms
  by: Jeff Erickson
  url: https://jeffe.cs.illinois.edu/teaching/algorithms/
  kind: book
  area: science-tech
  level: core
  free: true
  why: A rigorous and readable free algorithms textbook.
- id: quanta
  title: Quanta Magazine
  url: https://www.quantamagazine.org/
  kind: newsletter
  area: science-tech
  level: start
  free: true
  why: Excellent writing on developments in math, physics, biology and computer science.
