# The math and science foundations path. Move a milestone forward by changing its status: todo → doing → done.
title: Math foundations
order: 4
area: science-tech
tagline: The math that makes algorithms, systems and AI make sense.
why: >
  Linear algebra, probability, calculus and information theory are the language that AI
  and much of engineering are written in. You don't need to become a mathematician, but a
  working fluency turns papers from opaque to readable and lets you reason instead of guess.
outcome: >
  You can read the math in an ML paper or a performance analysis, follow the derivations,
  and use the ideas to reason about real systems.
stages:
  - title: Algorithms and discrete math
    summary: The reasoning tools behind every efficient program.
    milestones:
      - id: complexity
        title: Complexity and amortized analysis
        learn:
          - Big-O, Big-Theta, and what they hide
          - Amortized analysis (why vector push_back is O(1) on average)
          - The constant factors that matter on real hardware
        practice: Prove the amortized cost of a doubling array, then benchmark it.
        check:
          - Why is push_back amortized O(1) even though some calls are O(n)?
        resources:
          - { title: "Algorithms (Jeff Erickson, free)", url: "https://jeffe.cs.illinois.edu/teaching/algorithms/", kind: book }
      - id: data-structures
        title: Data structures and graphs
        learn:
          - Hash tables, heaps, balanced trees, tries
          - Graph representations, BFS, DFS, shortest paths, topological sort
        practice: Implement a heap and Dijkstra's algorithm in C++ with tests.
        check:
          - When would you choose a heap over a sorted array?
      - id: proofs
        title: Proofs and logic
        learn:
          - Induction, invariants, and proof by contradiction
          - Loop invariants as a tool for writing correct code
        practice: Write the loop invariant for binary search and use it to get the edge cases right the first time.
        resources:
          - { title: "MIT 6.042J Mathematics for Computer Science", url: "https://ocw.mit.edu/courses/6-042j-mathematics-for-computer-science-spring-2015/", kind: course }

  - title: Linear algebra
    summary: The language of data, graphics and neural networks.
    milestones:
      - id: vectors-matrices
        title: Vectors, matrices and transformations
        learn:
          - Vectors as directions and as data
          - Matrices as linear transformations; matrix multiplication as composition
          - Dot products, projections and similarity
        practice: Implement matrix multiply in C++ three ways and compare cache behavior.
        check:
          - Why is the dot product a measure of similarity?
        resources:
          - { title: "3Blue1Brown: Essence of linear algebra", url: "https://www.3blue1brown.com/topics/linear-algebra", kind: video }
      - id: eigen-svd
        title: Eigenvectors and SVD
        learn:
          - Eigenvectors and eigenvalues, geometrically
          - Singular value decomposition and low-rank approximation
          - PCA as an application
        practice: Compress an image with a truncated SVD and plot error against rank.
        check:
          - What does the rank of a matrix tell you?
        resources:
          - { title: "MIT 18.06 Linear Algebra (Strang)", url: "https://ocw.mit.edu/courses/18-06-linear-algebra-spring-2010/", kind: course }
          - { title: "Mathematics for Machine Learning (free book)", url: "https://mml-book.github.io/", kind: book }

  - title: Probability and statistics
    summary: Reasoning under uncertainty.
    milestones:
      - id: probability
        title: Probability and Bayes
        learn:
          - Conditional probability and Bayes' rule
          - Random variables, expectation and variance
          - Common distributions and where they show up
        practice: Simulate the base-rate problem and compare it with Bayes' rule by hand.
        check:
          - Why can a 99% accurate test still be wrong most of the time?
        resources:
          - { title: "Seeing Theory (visual probability)", url: "https://seeing-theory.brown.edu/", kind: course }
      - id: statistics
        title: Statistics for engineers
        learn:
          - Sampling, confidence intervals, and statistical significance
          - Percentiles and tail latency (why p99 matters)
          - A/B testing and its pitfalls
        practice: Measure a benchmark's distribution and report it with percentiles and a confidence interval.
        check:
          - Why is mean latency a misleading summary?

  - title: Calculus and optimization
    summary: How learning machines learn.
    milestones:
      - id: derivatives
        title: Derivatives and gradients
        learn:
          - Derivatives as rates of change; partial derivatives and gradients
          - The chain rule, and why it is the core of backpropagation
        practice: Implement a tiny automatic differentiation engine for scalars.
        check:
          - What does the gradient point toward?
        resources:
          - { title: "3Blue1Brown: Essence of calculus", url: "https://www.3blue1brown.com/topics/calculus", kind: video }
      - id: optimization
        title: Gradient descent and friends
        learn:
          - Gradient descent, learning rates, and momentum
          - Stochastic and mini-batch training; Adam in intuition
          - Convex vs non-convex problems
        practice: Train a linear model with your autodiff engine and plot the loss curve for three learning rates.
        check:
          - What happens when the learning rate is too high?

  - title: Information theory
    summary: Entropy, compression, and why LLMs are trained the way they are.
    milestones:
      - id: entropy
        title: Entropy, cross-entropy and KL divergence
        learn:
          - Entropy as average surprise
          - Cross-entropy as the loss language models minimize
          - KL divergence, and where it appears in training
        practice: Compute the cross-entropy of a simple character-level model on a text sample.
        check:
          - Why does minimizing cross-entropy make a model a better predictor?
        resources:
          - { title: "Visual information theory (Chris Olah)", url: "https://colah.github.io/posts/2015-09-Visual-Information/", kind: article }

  - title: The science habit
    summary: Keeping curiosity alive across science and engineering.
    milestones:
      - id: weekly-read
        title: One development a week
        learn:
          - Following a few high-quality science and engineering sources
          - Writing a short note on what changed and why it matters
        practice: Write one science or engineering note a week for two months.
        resources:
          - { title: "Quanta Magazine", url: "https://www.quantamagazine.org/", kind: article }
